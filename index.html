:root{--royal:#1F3FA8;--deep:#142C7A;--gold:#D4AF37;--ink:#0E0E12;--bg:#0E0E12;--surface:#16244F;--surface2:#1F3366;--text:#F4F1E8;--muted:#B9C4E4;--accent:#8FB0FF;--goldText:#D4AF37;--border:#6B5A22;--ok:#7DDBA3;--danger:#FF8A8A;--shadow:0 2px 10px rgba(0,0,0,.45);--fs:16px}
body.light{--bg:#FBF8F0;--surface:#FFFFFF;--surface2:#F3EEDD;--text:#0E0E12;--muted:#4A5370;--accent:#1F3FA8;--goldText:#8A6A12;--border:#E0CF94;--ok:#1E7A46;--danger:#B3261E;--shadow:0 2px 8px rgba(14,14,18,.12)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%;font-size:var(--fs)}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:11;background:linear-gradient(180deg,var(--royal),var(--deep));color:#fff;border-bottom:3px solid var(--gold);box-shadow:0 2px 8px rgba(14,14,18,.5);padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px}
header.top .mark{width:30px;height:30px;border-radius:50%;background:var(--ink);border:2px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:16px}
.wrap{max-width:820px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
h1{font-size:1.45em;margin:4px 0 6px;color:var(--text);padding-bottom:6px;border-bottom:2px solid var(--gold);display:inline-block}
.sub{color:var(--muted);font-size:.92em}
.card{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:12px;padding:14px;margin:14px 0;box-shadow:var(--shadow)}

.card .card{border-top-width:1px;box-shadow:none}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
button,.btn{font:inherit;font-size:.88em;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:7px 12px;cursor:pointer}
button.active{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.btn.primary{background:var(--royal);color:#fff;border:1px solid var(--gold);font-weight:600;box-shadow:0 1px 0 var(--ink)}
.btn.danger{color:var(--danger)}
.callout{background:var(--surface2);border-left:4px solid var(--gold);padding:10px 12px;border-radius:8px;color:var(--muted);font-size:.9em;margin:8px 0}
.ref-row{margin:0 0 10px}.muted,.ref-note{color:var(--muted)}
.term{margin:0 0 10px}.term .label{font-weight:700;color:var(--goldText);display:block}
ol.qlist{padding-left:1.2rem;margin:0}ol.qlist li{margin:0 0 10px}ol.qlist li::marker{color:var(--goldText);font-weight:700}.quiz-a{color:var(--ok);margin-top:4px}
.toggle{display:flex;align-items:center;gap:10px;margin-bottom:10px}.toggle input{width:18px;height:18px;accent-color:var(--royal)}
.quote{background:var(--surface2);border-radius:8px;padding:12px;margin:8px 0;border-left:4px solid var(--gold)}
.quote .cite{color:var(--muted);font-size:.82em;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:linear-gradient(160deg,var(--royal),var(--deep));color:#fff;border:1px solid var(--gold);border-radius:10px;padding:12px;text-align:left;font-size:.95em}
.tile .muted{color:#D9E0F5!important}
.links a{display:block;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:6px 0;text-decoration:none}
.links a small{display:block;color:var(--muted)}
input[type=text],input[type=search],textarea,select{font:inherit;width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px;margin:4px 0 10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
textarea{min-height:140px}
.note{border-top:1px solid var(--border);padding:10px 0}.note:first-child{border-top:0}
.note h3{margin:0 0 4px;font-size:1em}.tag{display:inline-block;font-size:.75em;background:var(--ink);border:1px solid var(--gold);border-radius:999px;padding:1px 8px;color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--deep);border-top:2px solid var(--gold);box-shadow:0 -2px 10px rgba(14,14,18,.5);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);z-index:10}
nav.tabs button{flex:1;border:0;border-radius:0;background:none;padding:8px 2px 10px;color:#C9D3F0;font-size:.72em;display:flex;flex-direction:column;align-items:center;gap:2px;border-top:3px solid transparent;margin-top:-2px}
nav.tabs button .ic{font-size:1.5em;line-height:1}
nav.tabs button.on{color:var(--gold);font-weight:700;border-top-color:var(--gold);background:rgba(14,14,18,.25)}
.say{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;border-radius:50%;background:var(--royal);color:#fff;border:2px solid var(--gold);flex:0 0 auto;vertical-align:middle;box-shadow:0 1px 0 var(--ink)}
.say.on{background:var(--gold);color:var(--ink)}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h2.h-row{padding-bottom:6px}
.q-head{float:right;margin:-4px -4px 6px 8px}
.btn.listen{background:var(--ink);color:var(--gold);border:1px solid var(--gold);font-weight:700}
.speaking{outline:2px solid var(--gold);outline-offset:2px;background:rgba(212,175,55,.16)!important;border-radius:8px;transition:background .3s}
.ref-row.speaking,.ov-text.speaking{padding:4px 6px}
#player{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:12;max-width:804px;margin:0 auto;display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#16244F,var(--ink));color:#fff;border:2px solid var(--gold);border-radius:14px;padding:8px 10px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
#player[hidden]{display:none}
#player .pl-txt{flex:1;min-width:0;line-height:1.25}#player small{color:var(--gold);font-size:.72em;display:block;text-transform:uppercase;letter-spacing:.5px}
#player b{display:block;font-size:.88em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player button{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:transparent;color:#fff;border:1px solid rgba(212,175,55,.6);font-size:.85em}
#player button.pl-main{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.pl-eq{display:flex;align-items:flex-end;gap:2px;height:18px;width:16px}.pl-eq i{flex:1;background:var(--gold);border-radius:1px;animation:eq 1s infinite ease-in-out}.pl-eq i:nth-child(2){animation-delay:.2s}.pl-eq i:nth-child(3){animation-delay:.4s}.pl-eq.paused i{animation:none;height:30%}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
body.has-player .wrap{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border:1px solid var(--gold);padding:8px 14px;border-radius:999px;font-size:.85em;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}#toast.show{opacity:1}
input[type=range]{width:100%;accent-color:var(--gold)}
@media(prefers-reduced-motion:reduce){.pl-eq i{animation:none}}
</style></head>

const BOOK_ABBR={genesis:"GEN",exodus:"EXO",leviticus:"LEV",numbers:"NUM",deuteronomy:"DEU",joshua:"JOS",judges:"JDG",ruth:"RUT","1 samuel":"1SA","2 samuel":"2SA","1 kings":"1KI","2 kings":"2KI","1 chronicles":"1CH","2 chronicles":"2CH",ezra:"EZR",nehemiah:"NEH",esther:"EST",job:"JOB",psalm:"PSA",psalms:"PSA",proverbs:"PRO",ecclesiastes:"ECC","song of solomon":"SNG","song of songs":"SNG",isaiah:"ISA",jeremiah:"JER",lamentations:"LAM",ezekiel:"EZK",daniel:"DAN",hosea:"HOS",joel:"JOL",amos:"AMO",obadiah:"OBA",jonah:"JON",micah:"MIC",nahum:"NAM",habakkuk:"HAB",zephaniah:"ZEP",haggai:"HAG",zechariah:"ZEC",malachi:"MAL",matthew:"MAT",mark:"MRK",luke:"LUK",john:"JHN",acts:"ACT",romans:"ROM","1 corinthians":"1CO","2 corinthians":"2CO",galatians:"GAL",ephesians:"EPH",philippians:"PHP",colossians:"COL","1 thessalonians":"1TH","2 thessalonians":"2TH","1 timothy":"1TI","2 timothy":"2TI",titus:"TIT",philemon:"PHM",hebrews:"HEB",james:"JAS","1 peter":"1PE","2 peter":"2PE","1 john":"1JN","2 john":"2JN","3 john":"3JN",jude:"JUD",revelation:"REV"};

const DATA={"topics": [{"id": "creation", "name": "Creation", "overview": "The Bible opens with God as the Creator of everything. Genesis 1 and 2 describe an ordered creation that God calls good, with humanity made in God's image and given care of the earth. Later passages return to creation to praise God and to point to Christ's role in it.", "refs": [{"ref": "Genesis 1:1–2:3", "note": "The six days of creation and the seventh day of rest"}, {"ref": "Genesis 1:26–28", "note": "Humanity made in God's image and given dominion"}, {"ref": "Genesis 2:4–25", "note": "A closer look at Adam, Eve, and the garden"}, {"ref": "Psalm 19:1–6", "note": "The heavens declare God's glory"}, {"ref": "Psalm 104", "note": "A song praising God's care for creation"}, {"ref": "John 1:1–3", "note": "All things were made through the Word"}, {"ref": "Colossians 1:15–17", "note": "All things created by and for Christ"}, {"ref": "Hebrews 11:3", "note": "Understanding creation by faith"}], "terms": [{"label": "Image of God (Imago Dei)", "value": "Humanity reflects God in a unique way (Genesis 1:27)."}, {"label": "Dominion / stewardship", "value": "The calling to rule over and care for creation."}, {"label": "Sabbath", "value": "The seventh day of rest God blessed (Genesis 2:2–3)."}, {"label": "Ex nihilo", "value": "Latin for 'out of nothing'; creation not from pre-existing material."}, {"label": "Eden", "value": "The garden where God placed the first humans."}], "questions": ["What does it suggest about God that He repeatedly calls creation 'good'?", "How might being made in God's image shape the way you treat other people?", "What does stewardship of the earth look like in everyday life?", "Why do you think God rested on the seventh day, and what does rest mean for you?", "How do John 1 and Colossians 1 add to your understanding of Genesis 1?"], "quiz": [{"q": "On which day were humans created?", "a": "The sixth day (Genesis 1:26–31)."}, {"q": "What did God do on the seventh day?", "a": "He rested and blessed and sanctified the day (Genesis 2:2–3)."}, {"q": "Which New Testament book opens with 'In the beginning was the Word'?", "a": "The Gospel of John (John 1:1)."}, {"q": "What was the name of the garden God planted?", "a": "Eden (Genesis 2:8)."}, {"q": "Which psalm begins 'The heavens declare the glory of God'?", "a": "Psalm 19."}], "verse": {"text": "In the beginning God created the heaven and the earth.", "ref": "Genesis 1:1 (KJV)"}}, {"id": "faith", "name": "Faith", "overview": "Faith in the Bible is trust in God and His promises, even when outcomes are not yet visible. Hebrews 11 gives a 'hall of faith' of people who acted on that trust, and the New Testament presents faith as the way a person receives God's grace and lives it out.", "refs": [{"ref": "Hebrews 11", "note": "Definition of faith and examples from Abel to the prophets"}, {"ref": "Genesis 15:1–6", "note": "Abram believed God, and it was counted as righteousness"}, {"ref": "Romans 4", "note": "Paul explains Abraham's faith"}, {"ref": "Romans 10:17", "note": "Faith comes by hearing the word"}, {"ref": "James 2:14–26", "note": "Faith shown through works"}, {"ref": "Mark 9:14–29", "note": "'Lord, I believe; help thou mine unbelief'"}, {"ref": "Matthew 17:20", "note": "Faith as a grain of mustard seed"}], "terms": [{"label": "Faith", "value": "Confident trust in God and His word (Hebrews 11:1)."}, {"label": "Belief", "value": "Accepting something as true; in Scripture, often personal trust."}, {"label": "Righteousness", "value": "Right standing with God; credited to Abraham through faith."}, {"label": "Works", "value": "Actions that show faith is alive (James 2)."}, {"label": "Doubt", "value": "Uncertainty; Scripture shows God meeting people in it (Mark 9:24)."}], "questions": ["In your own words, how does Hebrews 11:1 define faith?", "Which person in Hebrews 11 do you relate to most, and why?", "How do Romans 4 and James 2 fit together on faith and works?", "What helps your faith grow, according to Romans 10:17 and your own experience?", "How does the father's prayer in Mark 9:24 speak to times of doubt?", "What is one step of trust you could take this week?"], "quiz": [{"q": "Which chapter is often called the 'hall of faith'?", "a": "Hebrews 11."}, {"q": "According to Hebrews 11:6, without faith it is impossible to do what?", "a": "To please God."}, {"q": "Whose faith was 'counted unto him for righteousness' in Genesis 15:6?", "a": "Abram (Abraham)."}, {"q": "James says faith without works is what?", "a": "Dead (James 2:17, 26)."}, {"q": "Jesus compared small faith to what seed?", "a": "A grain of mustard seed (Matthew 17:20)."}], "verse": {"text": "Now faith is the substance of things hoped for, the evidence of things not seen.", "ref": "Hebrews 11:1 (KJV)"}}, {"id": "grace", "name": "Grace & Salvation", "overview": "Grace is God's undeserved favor. The Bible describes all people as needing rescue from sin, and presents salvation as God's gift through Jesus Christ, received by faith rather than earned. Salvation includes forgiveness, a restored relationship with God, and new life.", "refs": [{"ref": "Ephesians 2:1–10", "note": "Saved by grace through faith, created for good works"}, {"ref": "Romans 3:21–26", "note": "All have sinned; justified freely by grace"}, {"ref": "Romans 5:6–11", "note": "Christ died for us while we were still sinners"}, {"ref": "Romans 6:23", "note": "The wages of sin and the gift of God"}, {"ref": "John 3:1–21", "note": "Jesus and Nicodemus; being born again"}, {"ref": "Titus 3:4–7", "note": "Saved by His mercy, not by our works"}, {"ref": "Luke 15:11–32", "note": "The parable of the prodigal son"}], "terms": [{"label": "Grace", "value": "God's favor freely given, not earned."}, {"label": "Mercy", "value": "God withholding the judgment we deserve."}, {"label": "Sin", "value": "Falling short of God's standard (Romans 3:23)."}, {"label": "Justification", "value": "Being declared righteous before God."}, {"label": "Redemption", "value": "Being bought back or set free at a price."}, {"label": "Born again", "value": "New spiritual birth Jesus describes in John 3."}], "questions": ["How would you explain the difference between grace and mercy?", "Why do you think Ephesians 2:8–9 stresses that salvation is 'not of works'?", "What does Ephesians 2:10 say we are saved for?", "What does the prodigal son's father show about God's grace?", "How might understanding grace change the way you see yourself and others?"], "quiz": [{"q": "According to Romans 3:23, who has sinned?", "a": "All have sinned and come short of the glory of God."}, {"q": "Complete Romans 6:23: 'the gift of God is…'", "a": "'…eternal life through Jesus Christ our Lord.'"}, {"q": "Which religious leader visited Jesus at night in John 3?", "a": "Nicodemus."}, {"q": "In Ephesians 2:8, we are saved by grace through what?", "a": "Faith."}, {"q": "In Luke 15, what did the father do when he saw his son far off?", "a": "He had compassion, ran, embraced and kissed him (Luke 15:20)."}], "verse": {"text": "For by grace are ye saved through faith; and that not of yourselves: it is the gift of God.", "ref": "Ephesians 2:8 (KJV)"}}, {"id": "prayer", "name": "Prayer", "overview": "Prayer is talking with God: praise, thanks, confession, and requests. Jesus taught His disciples how to pray and modeled a life of prayer, and the Psalms give words for every emotion. Scripture invites believers to pray honestly, persistently, and with trust.", "refs": [{"ref": "Matthew 6:5–15", "note": "Jesus teaches the Lord's Prayer"}, {"ref": "Luke 11:1–13", "note": "Ask, seek, knock"}, {"ref": "Luke 18:1–8", "note": "The persistent widow"}, {"ref": "Philippians 4:6–7", "note": "Prayer with thanksgiving and the peace of God"}, {"ref": "1 Thessalonians 5:16–18", "note": "Pray without ceasing"}, {"ref": "Psalm 51", "note": "David's prayer of confession"}, {"ref": "Mark 14:32–36", "note": "Jesus prays in Gethsemane"}, {"ref": "James 5:13–16", "note": "Prayer for the sick and for one another"}], "terms": [{"label": "Supplication", "value": "Humble, earnest request."}, {"label": "Intercession", "value": "Praying on behalf of others."}, {"label": "Confession", "value": "Admitting sin to God (Psalm 51; 1 John 1:9)."}, {"label": "Thanksgiving", "value": "Gratitude expressed to God."}, {"label": "Amen", "value": "Hebrew word meaning 'so be it' or 'truly'."}], "questions": ["Which parts of the Lord's Prayer focus on God, and which on our needs?", "What do you think 'pray without ceasing' looks like in a busy day?", "What does Jesus' prayer in Gethsemane teach about honest prayer?", "Why might Jesus tell a parable about persistence in prayer?", "How does Philippians 4:6–7 connect prayer and anxiety?", "Which kind of prayer (praise, thanks, confession, request) comes least naturally to you?"], "quiz": [{"q": "Where does Matthew record the Lord's Prayer?", "a": "Matthew 6 (verses 9–13)."}, {"q": "In Luke 11, what three verbs does Jesus use about prayer?", "a": "Ask, seek, knock (Luke 11:9)."}, {"q": "Where did Jesus pray before His arrest?", "a": "Gethsemane (Mark 14:32)."}, {"q": "Which psalm is David's prayer after his sin with Bathsheba?", "a": "Psalm 51."}, {"q": "According to Philippians 4:7, what will keep your heart and mind?", "a": "The peace of God, which passeth all understanding."}], "verse": {"text": "Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God.", "ref": "Philippians 4:6 (KJV)"}}, {"id": "love", "name": "Love", "overview": "The Bible says God is love, and that His love is shown most clearly in sending Jesus. Jesus summed up the law as loving God and loving neighbor, and Paul describes love as patient, kind, and enduring. Biblical love is active and self-giving, not only a feeling.", "refs": [{"ref": "1 Corinthians 13", "note": "The 'love chapter'"}, {"ref": "1 John 4:7–21", "note": "God is love; we love because He first loved us"}, {"ref": "John 3:16", "note": "God so loved the world"}, {"ref": "Matthew 22:34–40", "note": "The two greatest commandments"}, {"ref": "Luke 10:25–37", "note": "The good Samaritan"}, {"ref": "John 13:34–35", "note": "A new commandment: love one another"}, {"ref": "Romans 8:35–39", "note": "Nothing can separate us from God's love"}], "terms": [{"label": "Agape", "value": "Greek word for self-giving love, used of God's love."}, {"label": "Charity", "value": "KJV word for love in 1 Corinthians 13."}, {"label": "Neighbor", "value": "Anyone in need, as the good Samaritan shows."}, {"label": "Compassion", "value": "Feeling with someone and moving to help."}, {"label": "Steadfast love (hesed)", "value": "Hebrew idea of God's loyal, covenant love."}], "questions": ["Which description of love in 1 Corinthians 13:4–7 challenges you most?", "How does the good Samaritan answer the question 'Who is my neighbour?'", "Why do you think Jesus links love for God with love for neighbor?", "What does 1 John 4 say is the source of our love?", "How does Romans 8:38–39 encourage someone who feels unloved?"], "quiz": [{"q": "Which chapter is called the 'love chapter'?", "a": "1 Corinthians 13."}, {"q": "What are the two greatest commandments?", "a": "Love God with all your heart, soul and mind; love your neighbor as yourself (Matthew 22:37–39)."}, {"q": "According to 1 John 4:8, God is what?", "a": "Love."}, {"q": "In Jesus' parable, who stopped to help the wounded man?", "a": "A Samaritan (Luke 10:33)."}, {"q": "In 1 Corinthians 13:13, what is the greatest of faith, hope and love?", "a": "Love (charity in the KJV)."}], "verse": {"text": "We love him, because he first loved us.", "ref": "1 John 4:19 (KJV)"}}, {"id": "forgiveness", "name": "Forgiveness", "overview": "Forgiveness runs in two directions in Scripture: God forgives those who turn to Him, and those who are forgiven are called to forgive others. Jesus taught about forgiveness often and forgave even from the cross. Forgiveness releases a debt; it is not the same as pretending harm did not happen.", "refs": [{"ref": "Matthew 18:21–35", "note": "Seventy times seven; the unforgiving servant"}, {"ref": "Matthew 6:12, 14–15", "note": "Forgive us as we forgive"}, {"ref": "1 John 1:9", "note": "If we confess, He is faithful to forgive"}, {"ref": "Psalm 103:8–12", "note": "As far as the east is from the west"}, {"ref": "Luke 23:34", "note": "'Father, forgive them'"}, {"ref": "Genesis 45 and 50:15–21", "note": "Joseph forgives his brothers"}, {"ref": "Colossians 3:12–14", "note": "Forgive as the Lord forgave you"}], "terms": [{"label": "Forgiveness", "value": "Releasing someone from a debt or wrong."}, {"label": "Repentance", "value": "Turning away from sin and toward God."}, {"label": "Reconciliation", "value": "Restoring a broken relationship."}, {"label": "Trespass", "value": "A wrong or offense (Matthew 6:14)."}, {"label": "Atonement", "value": "God's provision for covering sin and restoring relationship."}], "questions": ["What point is Jesus making with the number 'seventy times seven'?", "How does the parable of the unforgiving servant connect God's forgiveness with ours?", "What stands out in how Joseph spoke to his brothers in Genesis 50:20?", "How is forgiveness different from trust or reconciliation?", "What does Psalm 103:12 say about how God deals with forgiven sin?", "What makes forgiving hard, and what helps?"], "quiz": [{"q": "Who asked Jesus how many times he should forgive?", "a": "Peter (Matthew 18:21)."}, {"q": "What did Jesus answer?", "a": "Until seventy times seven (Matthew 18:22)."}, {"q": "What did Jesus say about those crucifying Him in Luke 23:34?", "a": "'Father, forgive them; for they know not what they do.'"}, {"q": "Who said 'ye thought evil against me; but God meant it unto good'?", "a": "Joseph (Genesis 50:20)."}, {"q": "According to 1 John 1:9, what must we do to be forgiven?", "a": "Confess our sins."}], "verse": {"text": "And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ's sake hath forgiven you.", "ref": "Ephesians 4:32 (KJV)"}}, {"id": "jesus", "name": "The Life of Jesus", "overview": "The four Gospels (Matthew, Mark, Luke, John) tell the life of Jesus: His birth, baptism, teaching, miracles, death, and resurrection. They present Him as the promised Messiah and the Son of God, who came to reveal the Father and give His life for the world.", "refs": [{"ref": "Luke 2:1–20", "note": "Birth in Bethlehem"}, {"ref": "Matthew 3:13–17", "note": "Baptism by John"}, {"ref": "Matthew 4:1–11", "note": "Temptation in the wilderness"}, {"ref": "Matthew 5–7", "note": "The Sermon on the Mount"}, {"ref": "John 11", "note": "The raising of Lazarus"}, {"ref": "Mark 15", "note": "The crucifixion"}, {"ref": "Luke 24", "note": "The resurrection and Emmaus road"}, {"ref": "Acts 1:1–11", "note": "The ascension"}], "terms": [{"label": "Gospel", "value": "'Good news'; also the four books about Jesus."}, {"label": "Messiah / Christ", "value": "'Anointed one' in Hebrew / Greek."}, {"label": "Incarnation", "value": "God the Son taking on human flesh (John 1:14)."}, {"label": "Parable", "value": "A short story Jesus used to teach."}, {"label": "Resurrection", "value": "Jesus rising bodily from the dead."}, {"label": "Disciple", "value": "A follower and learner; Jesus chose twelve."}], "questions": ["Why might there be four Gospels instead of one?", "What do Jesus' temptations reveal about His character?", "Which teaching from the Sermon on the Mount is hardest to live out?", "What does Jesus' weeping at Lazarus' tomb show about Him?", "Why is the resurrection central to the Christian faith (see 1 Corinthians 15:14)?", "Which event in Jesus' life means the most to you, and why?"], "quiz": [{"q": "In what town was Jesus born?", "a": "Bethlehem (Luke 2:4–7)."}, {"q": "Who baptized Jesus?", "a": "John the Baptist (Matthew 3:13)."}, {"q": "How many days was Jesus tempted in the wilderness?", "a": "Forty days (Matthew 4:2)."}, {"q": "Whom did Jesus raise from the dead in John 11?", "a": "Lazarus."}, {"q": "On which road did the risen Jesus walk with two disciples?", "a": "The road to Emmaus (Luke 24:13)."}], "verse": {"text": "And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth.", "ref": "John 1:14 (KJV)"}}, {"id": "spirit", "name": "The Holy Spirit", "overview": "The Holy Spirit is present from creation (Genesis 1:2) and is promised by Jesus as the Comforter who teaches, guides, and empowers believers. At Pentecost the Spirit came upon the disciples, and the New Testament describes the Spirit's fruit and gifts in the life of the church.", "refs": [{"ref": "Genesis 1:2", "note": "The Spirit of God moved upon the waters"}, {"ref": "John 14:15–27", "note": "Jesus promises the Comforter"}, {"ref": "John 16:7–15", "note": "The Spirit guides into truth"}, {"ref": "Acts 2:1–41", "note": "Pentecost"}, {"ref": "Romans 8:1–27", "note": "Life in the Spirit; the Spirit helps us pray"}, {"ref": "1 Corinthians 12", "note": "Spiritual gifts and one body"}, {"ref": "Galatians 5:16–26", "note": "Walking in the Spirit; the fruit of the Spirit"}], "terms": [{"label": "Comforter / Advocate", "value": "Translations of the Greek parakletos, 'one called alongside'."}, {"label": "Pentecost", "value": "Jewish feast when the Spirit came in Acts 2."}, {"label": "Fruit of the Spirit", "value": "Character qualities listed in Galatians 5:22–23."}, {"label": "Spiritual gifts", "value": "Abilities given for the good of the church (1 Corinthians 12:7)."}, {"label": "Trinity", "value": "One God in three persons: Father, Son, and Holy Spirit."}], "questions": ["What roles does Jesus say the Spirit will have in John 14 and 16?", "What changed in the disciples after Pentecost?", "Which fruit of the Spirit do you most want to grow in?", "Why does Paul compare the church to a body in 1 Corinthians 12?", "How does Romans 8:26 encourage someone who doesn't know what to pray?"], "quiz": [{"q": "On what feast day did the Spirit come in Acts 2?", "a": "Pentecost."}, {"q": "What appeared on the disciples at Pentecost?", "a": "Cloven tongues like as of fire (Acts 2:3)."}, {"q": "Name the nine fruit of the Spirit.", "a": "Love, joy, peace, longsuffering, gentleness, goodness, faith, meekness, temperance (Galatians 5:22–23, KJV)."}, {"q": "What name does Jesus use for the Spirit in John 14:16 (KJV)?", "a": "The Comforter."}, {"q": "Who preached the sermon at Pentecost?", "a": "Peter (Acts 2:14)."}], "verse": {"text": "But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith, meekness, temperance: against such there is no law.", "ref": "Galatians 5:22–23 (KJV)"}}, {"id": "revelation", "name": "Revelation", "overview": "Revelation is the last book of the Bible, a vision given to John that reveals Jesus Christ as Lord of history and hope for His people. It uses vivid symbols (seals, trumpets, bowls, beasts, a new heaven and earth) to encourage churches facing pressure. Readers differ on timing: preterists see much fulfilled in the first century; historicists trace the church age; futurists place most events still ahead; idealists read it as timeless spiritual conflict. This guide highlights the book's message without choosing one school.", "refs": [{"ref": "Revelation 1:1–20", "note": "Title, blessing, and John's vision of the risen Christ"}, {"ref": "Revelation 2–3", "note": "Letters to the seven churches in Asia"}, {"ref": "Revelation 4–5", "note": "The throne in heaven and the Lamb who is worthy"}, {"ref": "Revelation 6–7", "note": "The seals opened; the sealed servants of God"}, {"ref": "Revelation 12–14", "note": "Conflict imagery: the woman, the dragon, and the Lamb"}, {"ref": "Revelation 19–20", "note": "Christ's victory; the thousand years; final judgment"}, {"ref": "Revelation 21–22", "note": "New heaven and new earth; the river of life; Come, Lord Jesus"}, {"ref": "Daniel 7; Matthew 24", "note": "Background visions and Jesus' teaching often compared with Revelation"}], "terms": [{"label": "Apocalypse", "value": "Greek for 'unveiling' or 'revelation'; the book's name."}, {"label": "Preterist", "value": "View that much of Revelation was fulfilled in the first century."}, {"label": "Historicist", "value": "View that Revelation sketches the course of church history."}, {"label": "Futurist", "value": "View that most of chapters 4–22 await future fulfillment."}, {"label": "Idealist", "value": "View that the book mainly pictures ongoing spiritual conflict."}, {"label": "Seven churches", "value": "Congregations in Asia Minor addressed in chapters 2–3."}], "questions": ["According to Revelation 1:1–3, what is this book, and who is blessed for engaging it?", "Which letter to the seven churches speaks most to your own spiritual life?", "How does the vision of the Lamb in Revelation 5 shape how you see power and worship?", "Which interpretive approach (preterist, historicist, futurist, idealist) do you lean toward, and why?", "What hope do Revelation 21–22 offer people who suffer now?", "How might studying Revelation change the way you wait for Christ's return?"], "quiz": [{"q": "Who received the visions recorded in Revelation?", "a": "John (Revelation 1:1, 4, 9)."}, {"q": "How many churches receive letters in Revelation 2–3?", "a": "Seven."}, {"q": "Who alone is found worthy to open the sealed book in Revelation 5?", "a": "The Lamb (Jesus Christ)."}, {"q": "What does Revelation 21:4 say God will wipe away?", "a": "All tears from their eyes; also no more death, sorrow, crying, or pain."}, {"q": "What are the closing words of Revelation (and of the Bible)?", "a": "'The grace of our Lord Jesus Christ be with you all. Amen.' (Revelation 22:21, KJV)."}], "verse": {"text": "Blessed is he that readeth, and they that hear the words of this prophecy, and keep those things which are written therein: for the time is at hand.", "ref": "Revelation 1:3 (KJV)"}}, {"id": "longsuffering", "name": "Longsuffering", "overview": "Longsuffering (often translated patience or forbearance) is the ability to endure delay, provocation, or hardship without giving up or striking back. Scripture presents it as both a character of God, who is slow to anger and gives room for repentance, and a fruit of the Spirit in believers who suffer trials and love difficult people.", "refs": [{"ref": "Exodus 34:6–7", "note": "The Lord proclaims Himself longsuffering and merciful"}, {"ref": "Romans 5:3–5", "note": "Tribulation works patience; patience, experience; experience, hope"}, {"ref": "Romans 2:4", "note": "The riches of God's goodness, forbearance, and longsuffering"}, {"ref": "2 Peter 3:8–9", "note": "The Lord is longsuffering, not willing that any should perish"}, {"ref": "Galatians 5:22–23", "note": "Longsuffering among the fruit of the Spirit"}, {"ref": "Colossians 1:11; 3:12–13", "note": "Strengthened unto all patience and longsuffering; put on longsuffering"}, {"ref": "James 1:2–4; 5:7–11", "note": "Patience through trials; the farmer and the prophets as examples"}, {"ref": "1 Corinthians 13:4", "note": "Charity (love) suffereth long"}], "terms": [{"label": "Longsuffering", "value": "KJV word for patient endurance of offense or delay (Greek makrothumia)."}, {"label": "Patience / perseverance", "value": "Enduring hardship; Greek hupomone often used of steadfastness under trial."}, {"label": "Forbearance", "value": "Holding back from deserved judgment or retaliation."}, {"label": "Slow to anger", "value": "Old Testament description of God's patient character (Exodus 34:6)."}, {"label": "Hope", "value": "In Romans 5, the fruit that grows through a chain beginning with tribulation."}], "questions": ["How does God's longsuffering in 2 Peter 3:9 differ from being 'slack' or uncaring?", "According to Romans 5:3–5, what chain of growth can begin with tribulation?", "Where do you most need longsuffering right now: with circumstances, with people, or with God's timing?", "How does Colossians 1:11 connect God's power with patience and joy?", "What does James 1:2–4 say patience can produce in a believer?", "How might remembering God's patience toward you help you be patient with someone else?"], "quiz": [{"q": "In Galatians 5:22 (KJV), which fruit of the Spirit is listed after peace?", "a": "Longsuffering."}, {"q": "According to Romans 5:3, tribulation worketh what?", "a": "Patience."}, {"q": "2 Peter 3:9 says the Lord is longsuffering, not willing that any should what?", "a": "Perish, but that all should come to repentance."}, {"q": "In Exodus 34:6, how does the Lord describe Himself regarding anger?", "a": "Longsuffering (slow to anger), and abundant in goodness and truth."}, {"q": "James 1:4 says let patience have her perfect work so that you may be what?", "a": "Perfect and entire, wanting nothing."}], "verse": {"text": "The Lord is not slack concerning his promise, as some men count slackness; but is longsuffering to us-ward, not willing that any should perish, but that all should come to repentance.", "ref": "2 Peter 3:9 (KJV)"}}], "commentary": {"creation": [{"passage": "Genesis 1:1, 26–28", "mhUrl": "https://biblehub.com/commentaries/mhcw/genesis/1.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/genesis/1.htm", "mh": {"kind": "Summary", "text": "Henry notes that man was made last of all the creatures, so no one could suppose humans helped God create; yet being made last was also an honour, since the palace was fully furnished before its resident arrived."}, "jfb": {"kind": "Quote", "text": "created—not formed from any pre-existing materials, but made out of nothing."}}, {"passage": "Psalm 19:1–6", "mhUrl": "https://biblehub.com/commentaries/mhcw/psalms/19.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/psalms/19.htm", "mh": {"kind": "Quote", "text": "From the things that are seen every day by all the world the psalmist, in these verses, leads us to the consideration of the invisible things of God"}, "jfb": {"kind": "Quote", "text": "the glory of God—is the sum of His perfections"}}], "faith": [{"passage": "Hebrews 11:1–3", "mhUrl": "https://biblehub.com/commentaries/mhcw/hebrews/11.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/hebrews/11.htm", "mh": {"kind": "Quote", "text": "Faith demonstrates to the eye of the mind the reality of those things that cannot be discerned by the eye of the body."}, "jfb": {"kind": "Summary", "text": "JFB says verse 1 is not a full definition of faith but a description of what faith does for us, given to encourage readers to persevere."}}, {"passage": "James 2:14–26", "mhUrl": "https://biblehub.com/commentaries/mhcw/james/2.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/james/2.htm", "mh": {"kind": "Summary", "text": "Henry takes up the classic question of how to reconcile Paul (justified by faith) and James (not by faith only), arguing the two agree: James warns against resting on a bare profession of faith that never changes one's life."}, "jfb": {"kind": "Summary", "text": "Citing Bengel, JFB explains that if the works a living faith produces are absent, it shows that the faith someone boasts of does not really exist; it is dead."}}], "grace": [{"passage": "Ephesians 2:8–10", "mhUrl": "https://biblehub.com/commentaries/mhcw/ephesians/2.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/ephesians/2.htm", "mh": {"kind": "Quote", "text": "All is the free gift of God, and the effect of being quickened by his power."}, "jfb": {"kind": "Quote", "text": "The instrument or mean of salvation on the part of the person saved; Christ alone is the meritorious agent."}}, {"passage": "Romans 3:19–26", "mhUrl": "https://biblehub.com/commentaries/mhcw/romans/3.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/romans/3.htm", "mh": {"kind": "Summary", "text": "Henry says Paul concludes it is in vain to seek justification by the works of any law; it is had only by faith, which is the point Paul has been proving since chapter 1."}, "jfb": {"kind": "Quote", "text": "justified freely—without anything done on our part to deserve."}}], "prayer": [{"passage": "Matthew 6:9–15", "mhUrl": "https://biblehub.com/commentaries/mhcw/matthew/6.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/matthew/6.htm", "mh": {"kind": "Summary", "text": "Henry sees the Lord's Prayer as Jesus helping our weakness by putting words in our mouths: a pattern for the matter and method of prayer that may be used as a form, though we are not tied to it alone."}, "jfb": {"kind": "Summary", "text": "JFB argues the prayer was given not only as a model but as an actual prayer to be prayed, showing how much real prayer fits in the fewest words."}}, {"passage": "Philippians 4:6–7", "mhUrl": "https://biblehub.com/commentaries/mhcw/philippians/4.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/philippians/4.htm", "mh": {"kind": "Summary", "text": "Henry distinguishes a good care of diligence (wise planning) from a care of distrust that perplexes the mind, and offers constant prayer as the remedy for anxious care."}, "jfb": {"kind": "Quote", "text": "Care and prayer are as mutually opposed as fire and water [Bengel]."}}], "love": [{"passage": "1 Corinthians 13:1–7", "mhUrl": "https://biblehub.com/commentaries/mhcw/1_corinthians/13.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/1_corinthians/13.htm", "mh": {"kind": "Summary", "text": "Henry explains that charity here means love in its fullest sense, true love to God and others, not merely giving alms; without it even the most glorious spiritual gifts count for nothing."}, "jfb": {"kind": "Quote", "text": "suffereth long—under provocations of evil from others. The negative side of love. is kind—the positive side."}}, {"passage": "Luke 10:25–37", "mhUrl": "https://biblehub.com/commentaries/mhcw/luke/10.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/luke/10.htm", "mh": {"kind": "Summary", "text": "Henry notes the lawyer asked about eternal life to test Jesus rather than to learn, yet the questions are ones every reader needs rightly answered."}, "jfb": {"kind": "Summary", "text": "JFB explains the lawyer wanted Jesus to define 'neighbor', a word the Jews of the day interpreted narrowly enough to exclude Samaritans and Gentiles; the parable overturns that."}}], "forgiveness": [{"passage": "Matthew 18:21–35", "mhUrl": "https://biblehub.com/commentaries/mhcw/matthew/18.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/matthew/18.htm", "mh": {"kind": "Summary", "text": "Henry observes that Peter already assumed he must forgive, but thought seven times in a lifetime was generous; the teaching concerns personal wrongs that are in our power to forgive."}, "jfb": {"kind": "Quote", "text": "you are never to come to the point of refusing forgiveness sincerely asked."}}, {"passage": "Genesis 50:15–21", "mhUrl": "https://biblehub.com/commentaries/mhcw/genesis/50.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/genesis/50.htm", "mh": {"kind": "Quote", "text": "God often brings good out of evil, and promotes the designs of his providence even by the sins of men"}, "jfb": {"kind": "Summary", "text": "JFB says Joseph, deeply moved, gave his brothers the strongest assurances of forgiveness, showing his own godly character and serving as a picture of the Saviour."}}], "jesus": [{"passage": "Matthew 4:1–11", "mhUrl": "https://biblehub.com/commentaries/mhcw/matthew/4.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/matthew/4.htm", "mh": {"kind": "Quote", "text": "Christ answered and baffled all the temptations of Satan with, It is written."}, "jfb": {"kind": "Summary", "text": "JFB explains that 'devil' means slanderer, and that the Spirit led Jesus into the wilderness to have His faith tried, though Satan's aim was to seduce Him from His allegiance to God."}}, {"passage": "John 11:1–44", "mhUrl": "https://biblehub.com/commentaries/mhcw/john/11.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/john/11.htm", "mh": {"kind": "Summary", "text": "On 'Jesus wept', Henry says the short verse shows Jesus was truly human, able to grieve, and that He gave this proof of His humanity before giving proof of His divinity by raising Lazarus."}, "jfb": {"kind": "Summary", "text": "JFB notes the word for Jesus' weeping means silent tears, unlike the loud wailing of the mourners, and that His two-day delay let things come to their worst to display God's glory."}}], "spirit": [{"passage": "Acts 2:1–4", "mhUrl": "https://biblehub.com/commentaries/mhcw/acts/2.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/acts/2.htm", "mh": {"kind": "Summary", "text": "Henry suggests the Spirit came at a great feast so that crowds from many countries would witness it, helping the gospel spread to all nations."}, "jfb": {"kind": "Quote", "text": "beautiful visible symbol of the burning energy of the Spirit now descending in all His plenitude upon the Church"}}, {"passage": "Galatians 5:16–26", "mhUrl": "https://biblehub.com/commentaries/mhcw/galatians/5.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/galatians/5.htm", "mh": {"kind": "Quote", "text": "grace is said to be the fruit of the Spirit, because it wholly proceeds from the Spirit, as the fruit does from the root"}, "jfb": {"kind": "Quote", "text": "love—the leader of the band of graces"}}], "revelation": [{"passage": "Revelation 1:1–3", "mhUrl": "https://biblehub.com/commentaries/mhcw/revelation/1.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/revelation/1.htm", "mh": {"kind": "Quote", "text": "This blessing seems to be pronounced with a design to encourage us to study this book, and not be weary of looking into it upon account of the obscurity of many things in it; it will repay the labour of the careful and attentive reader."}, "jfb": {"kind": "Quote", "text": "A special blessing attends him who reads or hears the apocalyptic \"prophecy\" with a view to keeping the things therein"}}, {"passage": "Revelation 21:1–4", "mhUrl": "https://biblehub.com/commentaries/mhcw/revelation/21.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/revelation/21.htm", "mh": {"kind": "Summary", "text": "Henry reads the new heaven and new earth as a more general account of the church's future happiness, which he thinks it safest to understand of the heavenly state, a new universe opened and filled with its heirs."}, "jfb": {"kind": "Quote", "text": "no more death—Greek, \"death shall be no more.\" Therefore it is not the millennium, for in the latter there is death"}}], "longsuffering": [{"passage": "Romans 5:1–5", "mhUrl": "https://biblehub.com/commentaries/mhcw/romans/5.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/romans/5.htm", "mh": {"kind": "Quote", "text": "Tribulation worketh patience, not in and of itself, but the powerful grace of God working in and with the tribulation."}, "jfb": {"kind": "Quote", "text": "Patience is the quiet endurance of what we cannot but wish removed, whether it be the withholding of promised good (Ro 8:25), or the continued experience of positive ill (as here)."}}, {"passage": "2 Peter 3:8–10", "mhUrl": "https://biblehub.com/commentaries/mhcw/2_peter/3.htm", "jfbUrl": "https://biblehub.com/commentaries/jfb/2_peter/3.htm", "mh": {"kind": "Summary", "text": "Henry stresses that the Lord is not slack beyond His appointed time; good people may think God delays too long, but His timetable differs from ours, and His longsuffering aims at repentance rather than indifference."}, "jfb": {"kind": "Summary", "text": "JFB notes that no delay which occurs is long to God; His measure of ages differs wholly from ours, so He neither needs to hasten nor delay the end according to human impatience."}}]}, "niv": {"creation": "In the beginning God created the heavens and the earth.", "faith": "Now faith is confidence in what we hope for and assurance about what we do not see.", "grace": "For it is by grace you have been saved, through faith—and this is not from yourselves, it is the gift of God—", "prayer": "Do not be anxious about anything, but in every situation, by prayer and petition, with thanksgiving, present your requests to God.", "love": "We love because he first loved us.", "forgiveness": "Be kind and compassionate to one another, forgiving each other, just as in Christ God forgave you.", "jesus": "The Word became flesh and made his dwelling among us. We have seen his glory, the glory of the one and only Son, who came from the Father, full of grace and truth.", "spirit": "But the fruit of the Spirit is love, joy, peace, forbearance, kindness, goodness, faithfulness, gentleness and self-control. Against such things there is no law.", "revelation": "Blessed is the one who reads aloud the words of this prophecy, and blessed are those who hear it and take to heart what is written in it, because the time is near.", "longsuffering": "The Lord is not slow in keeping his promise, as some understand slowness. Instead he is patient with you, not wanting anyone to perish, but everyone to come to repentance."}};

const TTS={mode:null,ok:false,voices:[],cfg:Object.assign({voice:"",rate:1,pitch:1},LS.get("bsg-tts",{})),

function ttsDetect(){
 if(window.AndroidTTS){TTS.mode="native";TTS.ok=!!(AndroidTTS.isReady&&AndroidTTS.isReady());if(TTS.ok)ttsLoadVoices();return}
 if("speechSynthesis" in window&&window.SpeechSynthesisUtterance){TTS.mode="web";try{speechSynthesis.cancel()}catch(e){}
  const chk=()=>{ttsLoadVoices();const was=TTS.ok;TTS.ok=TTS.voices.length>0;if(was!==TTS.ok)render()};
  ttsLoadVoices();TTS.ok=TTS.voices.length>0;
  if(speechSynthesis.addEventListener)speechSynthesis.addEventListener("voiceschanged",chk);else speechSynthesis.onvoiceschanged=chk;
  setTimeout(chk,800);setTimeout(chk,2500);return}
 TTS.mode=null;TTS.ok=false}
window.__ttsNativeReady=function(){TTS.ok=true;ttsLoadVoices();render()};
function ttsLoadVoices(){let v=[];
 if(TTS.mode==="native"){try{v=JSON.parse(AndroidTTS.getVoices()||"[]")}catch(e){v=[]}}
 else if(TTS.mode==="web"){v=speechSynthesis.getVoices().map(x=>({name:x.name,lang:x.lang,label:x.name+" ("+x.lang+")"+(x.localService===false?" · online":""),_v:x}))}
 const en=v.filter(x=>/^en/i.test(x.lang));if(en.length)v=en;
 v.sort((a,b)=>(a.network?1:0)-(b.network?1:0)||a.lang.localeCompare(b.lang)||a.label.localeCompare(b.label));TTS.voices=v}
// Make references and abbreviations sound natural
function spk(s){return String(s)
 .replace(/\(KJV\)/g,", King James Version.").replace(/\(NIV\)/g,", New International Version.")
 .replace(/\b([123])\s+(Samuel|Kings|Chronicles|Corinthians|Thessalonians|Timothy|Peter|John)\b/g,(m,n,b)=>["","First","Second","Third"][n]+" "+b)
 .replace(/(\d+):(\d+)\s*[–\-]\s*(\d+):(\d+)/g,"chapter $1 verse $2 through chapter $3 verse $4")
 .replace(/(\d+):(\d+)\s*[–\-]\s*(\d+)/g,"chapter $1, verses $2 through $3")
 .replace(/(\d+):(\d+)/g,"chapter $1, verse $2")
 .replace(/(\d+)\s*[–\-]\s*(\d+)/g,"$1 through $2")
 .replace(/\bJFB\b/g,"Jamieson, Fausset and Brown").replace(/\bRo\b/g,"Romans").replace(/[—–]/g,", ").replace(/\s+/g," ").trim()}
function splitChunks(t){const parts=t.match(/[^.!?;:]+[.!?;:]*["'’”)]*\s*/g)||[t];const out=[];let cur="";
 parts.forEach(p=>{if((cur+p).length>220&&cur){out.push(cur.trim());cur=""}cur+=p});if(cur.trim())out.push(cur.trim());return out}
// Speakable items, addressed by id (sid) so highlights survive re-render
function ttsItem(sid){const [k,id,a,b]=sid.split(":"),t=topic(id);
 if(k==="ov")return{label:t.name+" overview",text:t.name+". Overview. "+t.overview};
 if(k==="mv"){const txt=a==="NIV"?DATA.niv[t.id]:t.verse.text,ref=cleanRef(t.verse.ref);return{label:ref+" ("+a+")",text:txt+" — "+ref+" ("+a+")"}}
 if(k==="cm"){const c=DATA.commentary[t.id][+a],q=c[b],who=b==="mh"?"Matthew Henry":"JFB";return{label:who+" on "+c.passage,text:who+(q.kind==="Quote"?"":", in summary,")+" on "+c.passage+". "+q.text}}
 if(k==="rf"){const r=t.refs[+a];return{label:r.ref,text:r.ref+". "+r.note+"."}}
 return null}
function ttsTopicQueue(id){const t=topic(id);return ["ov:"+id,"mv:"+id+":"+S.version,...t.refs.map((_,i)=>"rf:"+id+":"+i)]}
function ttsPlay(sids,label){if(!TTS.ok)return;ttsHalt();TTS.q=sids;TTS.qi=0;TTS.label=label||"";TTS.active=true;TTS.paused=false;ttsStartItem()}
function ttsStartItem(){if(TTS.qi>=TTS.q.length){ttsFinish();return}const it=ttsItem(TTS.q[TTS.qi]);if(!it){TTS.qi++;return ttsStartItem()}
 TTS.sid=TTS.q[TTS.qi];TTS.chunks=splitChunks(spk(it.text));TTS.ci=0;TTS.cur=it.label;ttsMark();ttsUI();ttsSpeakChunk()}
function ttsSpeakChunk(){const text=TTS.chunks[TTS.ci],uid="u"+(++TTS.n);TTS.uid=uid;const c=TTS.cfg;
 if(TTS.mode==="native"){AndroidTTS.speak(text,uid,+c.rate,+c.pitch,c.voice||"");return}
 const u=new SpeechSynthesisUtterance(text);u.rate=+c.rate;u.pitch=+c.pitch;const v=TTS.voices.find(x=>x.name===c.voice);if(v&&v._v){u.voice=v._v;u.lang=v.lang}
 u.onend=()=>window.__ttsEvent("done",uid);u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled")window.__ttsEvent("error",uid)};
 speechSynthesis.speak(u)}
window.__ttsEvent=function(type,uid){if(uid!==TTS.uid||TTS.paused||!TTS.active)return;
 if(type==="error"){ttsHalt();ttsToast("Couldn't play audio on this device.");return}
 TTS.ci++;if(TTS.ci<TTS.chunks.length)ttsSpeakChunk();else{TTS.qi++;ttsStartItem()}};
function ttsCancelEngine(){TTS.uid=null;try{if(TTS.mode==="native")AndroidTTS.stop();else if(TTS.mode==="web")speechSynthesis.cancel()}catch(e){}}
// Pause = stop the engine and remember the sentence; resume restarts that sentence (works on every engine)
function ttsPause(){if(!TTS.active||TTS.paused)return;TTS.paused=true;ttsCancelEngine();ttsUI()}
function ttsResume(){if(!TTS.active||!TTS.paused)return;TTS.paused=false;ttsUI();ttsSpeakChunk()}
function ttsHalt(){ttsCancelEngine();TTS.active=false;TTS.paused=false;TTS.sid=null;TTS.q=[];ttsMark();ttsUI()}
function ttsFinish(){TTS.active=false;TTS.sid=null;TTS.uid=null;ttsMark();ttsUI()}
function ttsSkip(d){if(!TTS.active)return;ttsCancelEngine();TTS.paused=false;TTS.qi=Math.max(0,TTS.qi+d);ttsStartItem()}

function ttsUI(){let p=document.getElementById("player");if(!p){p=document.createElement("div");p.id="player";p.setAttribute("role","region");p.setAttribute("aria-label","Audio player");document.body.appendChild(p)}

 <div class="card"><h2>Memory verse</h2><div class="grid2"><div class="quote" data-sid="mv:${t.id}:KJV"><span class="q-head">${say("mv:"+t.id+":KJV")}</span>${esc(t.verse.text)}<div class="cite">${esc(t.verse.ref)}</div></div><div class="quote" data-sid="mv:${t.id}:NIV"><span class="q-head">${say("mv:"+t.id+":NIV")}</span>${esc(DATA.niv[t.id])}<div class="cite">${esc(t.verse.ref.replace("(KJV)","(NIV)"))}</div></div></div>${mh?`<div style="margin-top:8px">${A(mh,"Open "+mc+" ("+S.version+")")}</div>`:""}</div>`}

function notes(){
 if(S.editing){const n=S.editing;return `<h1>${n.id?"Edit note":"New note"}</h1><div class="card">
  <label>Title</label><input type="text" id="nTitle" value="${esc(n.title||"")}">
  <label>Topic (optional)</label><select id="nTopic"><option value="">— None —</option>${DATA.topics.map(t=>`<option value="${t.id}" ${n.topic===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select>
  <label>Note</label><textarea id="nBody">${esc(n.body||"")}</textarea>
  <div class="row"><button class="btn primary" data-a="save-note">Save</button><button data-a="cancel-note">Cancel</button>${n.id?'<button class="btn danger" data-a="del-note" data-v="'+n.id+'">Delete</button>':""}</div></div>`}
 const q=S.q.toLowerCase();const list=S.notes.filter(n=>!q||(n.title+" "+n.body+" "+(n.topic?topic(n.topic).name:"")).toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated);
 return `<h1>Notes</h1><div class="card"><div class="row"><button class="btn primary" data-a="new-note">＋ New note</button><button data-a="export">Export</button><button data-a="import">Import</button><input type="file" id="importFile" accept="application/json,.json" style="display:none"></div>
  <input type="search" id="nSearch" placeholder="Search notes…" value="${esc(S.q)}" style="margin-top:10px"></div>
  <div class="card">${list.length?list.map(n=>`<div class="note"><h3>${esc(n.title||"Untitled")}</h3>${n.topic?`<span class="tag">${esc(topic(n.topic).name)}</span> `:""}<span class="muted" style="font-size:.8em">${new Date(n.updated).toLocaleString()}</span>
  <div style="white-space:pre-wrap;margin:6px 0">${esc((n.body||"").slice(0,280))}${(n.body||"").length>280?"…":""}</div><div class="row"><button data-a="edit-note" data-v="${n.id}">Edit</button><button class="btn danger" data-a="del-note" data-v="${n.id}">Delete</button></div></div>`).join(""):'<p class="muted">No notes yet'+(q?" matching your search":"")+'.</p>'}</div>`}

function settings(){return `<h1>Settings</h1>
 <div class="card"><h2>Bible links</h2><p class="muted">Which app or site verse references open in.</p>${seg([["youversion","YouVersion"],["gateway","Bible Gateway"]],S.source,"set-source")}<p class="muted" style="margin-top:10px">Version</p>${seg([["KJV","KJV"],["NIV","NIV"]],S.version,"set-version")}</div>
 <div class="card"><h2>Appearance</h2><p class="muted">Theme</p>${seg([["dark","Dark"],["light","Light"]],S.theme,"set-theme")}<p class="muted" style="margin-top:10px">Text size</p>${seg([[14,"Small"],[16,"Medium"],[18,"Large"],[21,"Extra large"]],S.fs,"set-fs")}</div>
 <div class="card"><h2>Read aloud</h2>${TTS.ok?`<p class="muted">Uses your device's built-in voices${TTS.mode==="native"?" (Android text-to-speech)":""}. Audio keeps playing while you switch tabs.</p>
  <label for="ttsVoice">Voice</label><select id="ttsVoice"><option value="">Device default</option>${TTS.voices.map(v=>`<option value="${esc(v.name)}" ${v.name===TTS.cfg.voice?"selected":""}>${esc(v.label)}</option>`).join("")}</select>
  <label for="ttsRate">Speed: <b id="ttsRateV">${(+TTS.cfg.rate).toFixed(2)}×</b></label><input type="range" id="ttsRate" min="0.75" max="1.5" step="0.05" value="${TTS.cfg.rate}">
  <label for="ttsPitch">Pitch: <b id="ttsPitchV">${(+TTS.cfg.pitch).toFixed(2)}</b></label><input type="range" id="ttsPitch" min="0.5" max="1.5" step="0.05" value="${TTS.cfg.pitch}">
  <div class="row" style="margin-top:10px"><button class="btn primary" data-a="tts-test">${ICON_PLAY} Test voice</button><button data-a="tts-reset">Reset</button></div>`:`<p class="muted">Read-aloud isn't available on this device or browser (no text-to-speech voices found). On Android, install or enable a text-to-speech engine such as Speech Services by Google in system settings.</p>`}</div>
 <div class="card"><h2>About</h2><p><b>Bible Study Guides</b> v1.3.0 — ten topic study guides with quizzes, KJV and NIV memory verses, and notes from Matthew Henry's Commentary and Jamieson-Fausset-Brown. Your notes and settings stay on this device.</p>
 <p class="muted" style="font-size:.85em">KJV text is public domain. Scripture quotations marked NIV are taken from the Holy Bible, New International Version®, NIV®. Copyright ©1973, 1978, 1984, 2011 by Biblica, Inc.® Used by permission. All rights reserved worldwide.</p></div>`}

const TABS=[["home","⌂","Home"],["study","✝","Bible Study"],["notes","✎","Notes"],["settings","⚙","Settings"]];
function render(){applyTheme();const body={home,study,notes,settings}[S.tab]();
 document.getElementById("app").innerHTML=`<header class="top"><span class="mark">✝</span>Bible Study Guides</header><div class="wrap">${body}</div><nav class="tabs">${TABS.map(([k,i,l])=>`<button class="${S.tab===k?"on":""}" data-a="tab" data-v="${k}"><span class="ic">${i}</span>${l}</button>`).join("")}</nav>`;ttsMark(false)}

function exportNotes(){const json=JSON.stringify({app:"bible-study-guides",version:1,exported:new Date().toISOString(),notes:S.notes},null,2);const name="bible-notes-"+new Date().toISOString().slice(0,10)+".json";
 if(window.AndroidBridge&&AndroidBridge.shareFile){AndroidBridge.shareFile(name,json);return}
 const b=new Blob([json],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function importNotes(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const arr=Array.isArray(d)?d:d.notes;if(!Array.isArray(arr))throw 0;
 const ids=new Set(S.notes.map(n=>n.id));let added=0;arr.forEach(n=>{if(n&&typeof n==="object"&&(n.title||n.body)){if(!n.id||ids.has(n.id)){if(ids.has(n.id)){const i=S.notes.findIndex(x=>x.id===n.id);if((n.updated||0)>(S.notes[i].updated||0))S.notes[i]=n;return}n.id="n"+Date.now()+Math.random().toString(36).slice(2,6)}
 n.updated=n.updated||Date.now();S.notes.push(n);ids.add(n.id);added++}});saveNotes();render();alert("Imported "+added+" new note(s).")}catch(e){alert("That file isn't a valid notes backup.")}};r.readAsText(file)}

document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==="tab"){S.editing=null;go(v)}
 else if(a==="open-topic"){S.id=v;LS.set("bsg-last-topic",v);S.show=false;go("study");window.scrollTo(0,0)}
 else if(a==="set-topic"){S.id=v;LS.set("bsg-last-topic",v);S.show=false;render()}
 else if(a==="set-source"){S.source=v;savePrefs();render()}
 else if(a==="set-version"){S.version=v;savePrefs();render()}
 else if(a==="set-theme"){S.theme=v;savePrefs();render()}
 else if(a==="set-fs"){S.fs=+v;savePrefs();render()}
 else if(a==="new-note"){S.editing={title:"",body:"",topic:""};render()}
 else if(a==="add-note"){S.editing={title:topic(v).name+" notes",body:"",topic:v};go("notes");render()}
 else if(a==="edit-note"){S.editing={...S.notes.find(n=>n.id===v)};render()}
 else if(a==="cancel-note"){S.editing=null;render()}
 else if(a==="save-note"){const n=S.editing;n.title=document.getElementById("nTitle").value.trim();n.body=document.getElementById("nBody").value;n.topic=document.getElementById("nTopic").value;n.updated=Date.now();
  if(!n.title&&!n.body.trim()){alert("Add a title or some text first.");return}
  if(n.id){const i=S.notes.findIndex(x=>x.id===n.id);S.notes[i]=n}else{n.id="n"+Date.now()+Math.random().toString(36).slice(2,6);n.created=n.updated;S.notes.push(n)}saveNotes();S.editing=null;render()}
 else if(a==="del-note"){if(confirm("Delete this note?")){S.notes=S.notes.filter(n=>n.id!==v);saveNotes();S.editing=null;render()}}
 else if(a==="say"){if(TTS.active&&TTS.sid===v)ttsHalt();else{const it=ttsItem(v);ttsPlay([v],it&&it.label)}}
 else if(a==="listen-topic")ttsPlay(ttsTopicQueue(v),topic(v).name);
 else if(a==="tts-pause")ttsPause();else if(a==="tts-resume")ttsResume();else if(a==="tts-stop")ttsHalt();
 else if(a==="tts-next")ttsSkip(1);else if(a==="tts-prev")ttsSkip(TTS.ci>0?0:-1);
 else if(a==="tts-test")ttsPlay(["mv:"+DATA.topics[vodIndex()].id+":"+S.version],"Voice test");
 else if(a==="tts-reset"){TTS.cfg={voice:"",rate:1,pitch:1};ttsSaveCfg();render()}
 else if(a==="export")exportNotes();
 else if(a==="import")document.getElementById("importFile").click();
});
document.addEventListener("change",e=>{if(e.target.id==="showAnswers"){S.show=e.target.checked;render()}
 else if(e.target.id==="importFile"&&e.target.files[0])importNotes(e.target.files[0]);
 else if(e.target.id==="ttsVoice"){TTS.cfg.voice=e.target.value;ttsSaveCfg()}
 else if(e.target.id==="ttsRate"||e.target.id==="ttsPitch"){TTS.cfg[e.target.id==="ttsRate"?"rate":"pitch"]=+e.target.value;ttsSaveCfg()}});
document.addEventListener("input",e=>{if(e.target.id==="ttsRate"){TTS.cfg.rate=+e.target.value;document.getElementById("ttsRateV").textContent=TTS.cfg.rate.toFixed(2)+"×";ttsSaveCfg()}else if(e.target.id==="ttsPitch"){TTS.cfg.pitch=+e.target.value;document.getElementById("ttsPitchV").textContent=TTS.cfg.pitch.toFixed(2);ttsSaveCfg()}else if(e.target.id==="nSearch"){S.q=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById("nSearch");el.focus();el.setSelectionRange(pos,pos)}});
window.addEventListener("popstate",()=>{});
ttsDetect();render();ttsUI();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
